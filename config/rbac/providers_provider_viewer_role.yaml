# This rule is not used by the project platform-mesh-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to providers.platform-mesh.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-mesh-operator
    app.kubernetes.io/managed-by: kustomize
  name: providers-provider-viewer-role
rules:
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - providers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - providers/status
  verbs:
  - get
