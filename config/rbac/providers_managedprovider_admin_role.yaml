# This rule is not used by the project platform-mesh-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over providers.platform-mesh.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-mesh-operator
    app.kubernetes.io/managed-by: kustomize
  name: providers-managedprovider-admin-role
rules:
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - managedproviders
  verbs:
  - '*'
- apiGroups:
  - providers.platform-mesh.io
  resources:
  - managedproviders/status
  verbs:
  - get
